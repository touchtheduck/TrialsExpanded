name: Release Mod
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish-type:
        description: 'Type of release to publish'
        required: true
        default: 'STABLE'
        type: choice
        options:
          - STABLE
          - BETA
          - ALPHA

env:
  ORG_GRADLE_PROJECT_modrinthToken: ${{ secrets.MODRINTH_TOKEN }}
  ORG_GRADLE_PROJECT_curseforgeApikey: ${{ secrets.CURSEFORGE_API_KEY }}

permissions:
  contents: read

jobs:
  release:
    name: Release Mod
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Determine publish type
        id: set_publish_type
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "PUBLISH_TYPE=${{ github.event.inputs.publish-type }}" >> $GITHUB_ENV
          elif [ "${{ github.event.release.prerelease }}" = "true" ]; then
            echo "PUBLISH_TYPE=BETA" >> $GITHUB_ENV
          else
            echo "PUBLISH_TYPE=STABLE" >> $GITHUB_ENV
          fi

      - name: Setup JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: ${{ vars.JAVA_VERSION }}
          distribution: ${{ vars.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@f29f5a9d7b09a7c6b29859002d29d24e1674c884 # v5

      - name: Build packages
        run: |
          ./gradlew :NeoForge:build

      - name: Publish packages
        run: |
          ./gradlew :NeoForge:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish CurseForge
        run: ./gradlew :NeoForge:publishCurseforge

      - name: Publish Modrinth
        run: ./gradlew :NeoForge:publishModrinth